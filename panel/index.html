<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>墟 · AI Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="brand-header">
      <span class="brand-mark" aria-hidden="true">墟</span>
      <div>
        <strong>AI Assistant</strong>
        <small>使用你已有的 AI 账号</small>
      </div>
    </header>

    <main>
      <section class="notice" id="environment-notice" aria-live="polite"></section>

      <section class="card">
        <div class="section-heading">
          <div>
            <small>01 · 选择服务</small>
            <h1>打开你常用的 AI</h1>
          </div>
        </div>
        <div class="provider-grid" id="provider-grid"></div>
        <label class="tile-option"><input id="tile-window" type="checkbox" checked /> 与 XU 自动并排打开</label>
        <p class="privacy-note">扩展只负责打开你已登录的 AI 官网，并按需要把 XU 与 AI 排成左右窗口。需要提问的内容由你在 XU 页面自行复制、截图或手动整理；扩展不读取、不复制、不保存正文和对话。</p>
      </section>

      <section class="footer-actions">
        <button id="check-update" class="quiet-button" type="button">检查更新</button>
        <a href="https://github.com/Lucifer-cgl/XU-AI-Assistant" target="_blank" rel="noreferrer">项目与帮助</a>
        <span id="version-label"></span>
      </section>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="panel.js"></script>
  </body>
</html>
